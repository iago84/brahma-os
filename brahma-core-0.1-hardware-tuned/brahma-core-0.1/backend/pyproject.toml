[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brahma-core"
version = "0.1.0"
description = "Local-first knowledge and reasoning engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.9",
  "loguru>=0.7,<1"
]

[project.optional-dependencies]
knowledge = [
  "qdrant-client>=1.11,<2",
  "neo4j>=5.24,<7"
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
